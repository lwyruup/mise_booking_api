[project]
name = "mise-booking-api"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "aiosqlite>=0.22.1",
    "alembic>=1.20.0",
    "fastapi>=0.141.1",
    "greenlet>=3.5.6",
    "httpx>=0.28.1",
    "pydantic-settings>=2.15.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "sqlalchemy>=2.0.53",
    "uvicorn[standard]>=0.53.0",
]
[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
